# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# Run locally with `just deny`; enforced in CI by the `deny` job.

[advisories]
version = 2
yanked = "deny"
# Only flag unmaintained crates we directly depend on (actionable), not deep
# transitive crates we don't control.
unmaintained = "workspace"
ignore = [
    # Marvin timing leak; rsa crate has no constant-time patch. Used only for
    # optional Widevine/CPIX request signing, not online RSA decryption.
    { id = "RUSTSEC-2023-0071", reason = "no upstream patch; RSA used for offline request signatures only" },
    # rcgen (test-only) pulls time < 0.3.47; the patched time crate needs rustc 1.88.
    { id = "RUSTSEC-2026-0009", reason = "dev-only via rcgen; patched time requires rustc 1.88 > MSRV 1.85" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots (rustls TLS roots)
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Warn (don't fail) when a dependency is pulled in at multiple versions.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
