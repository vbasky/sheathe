name: Release

on:
  push:
    tags: [v*]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,     os: macos-latest }
          - { target: x86_64-apple-darwin,      os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc,   os: windows-latest }
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      # The CLI binary is named after the repository (see the [[bin]] in the
      # *-cli crate). Adjust `bin` here if you rename the binary.
      - name: Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="${{ github.event.repository.name }}"
          cd "target/${{ matrix.target }}/release"
          archive="${bin}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$archive" "$bin"
          echo "archive=$archive" >> "$GITHUB_ENV"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bin="${{ github.event.repository.name }}"
          cd "target/${{ matrix.target }}/release"
          archive="${bin}-${{ github.ref_name }}-${{ matrix.target }}.zip"
          7z a "$archive" "${bin}.exe"
          echo "archive=$archive" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ env.archive }}

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true
          path: /tmp/assets

      - name: Checksums
        working-directory: /tmp/assets
        run: |
          for f in *; do
            [[ "$f" != *.sha256 ]] && shasum -a 256 "$f" > "$f.sha256"
          done

      - name: Generate release notes from CHANGELOG
        run: |
          VERSION="${{ github.ref_name }}"
          awk -v ver="${VERSION#v}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.event.repository.name }} ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          files: /tmp/assets/*
          fail_on_unmatched_files: true

  publish:
    name: Publish to crates.io
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup update stable --no-self-update

      - name: Publish crates in dependency order
        shell: bash
        run: |
          set -euo pipefail

          version="${VERSION#v}"
          # A crate must appear after every crate it depends on.
          crates=(
            sheathe-core
            sheathe-crypto
            sheathe-text
            sheathe-ts
            sheathe-es
            sheathe-mkv
            sheathe-mp4
            sheathe-dash
            sheathe-hls
            sheathe-package
            sheathe-cli
            sheathe
          )

          already_published() {
            local crate="$1"
            local v="$2"
            local status
            status=$(curl -sS -o /dev/null -w "%{http_code}" \
              -A "sheathe-release-bot (https://github.com/${{ github.repository }})" \
              "https://crates.io/api/v1/crates/${crate}/${v}")
            [[ "$status" == "200" ]]
          }

          publish_with_retries() {
            local crate="$1"
            local attempts=5
            local delay=20

            if already_published "$crate" "$version"; then
              echo "==> ${crate} ${version} already on crates.io — skipping"
              return 0
            fi

            for attempt in $(seq 1 "$attempts"); do
              echo "==> Publishing ${crate} ${version} (attempt ${attempt}/${attempts})"
              output=$(cargo publish -p "$crate" --locked 2>&1) && return 0

              if echo "$output" | grep -q "already exists\|already uploaded"; then
                echo "==> ${crate} ${version} already published"
                return 0
              fi

              echo "$output" >&2

              if [[ "$attempt" -lt "$attempts" ]]; then
                echo "==> Waiting ${delay}s before retry"
                sleep "$delay"
              fi
            done

            echo "ERROR: failed to publish ${crate} ${version} after ${attempts} attempts" >&2
            return 1
          }

          for crate in "${crates[@]}"; do
            publish_with_retries "$crate"
          done
